name: Submit production URLs to IndexNow (manual fallback)

# Production releases submit from the local machine after Vercel is READY.
# deployment_status ignores [skip ci], so it must not be an automatic trigger.
on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Submit only after this commit is live in production
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/indexnow-after-deploy.mjs
