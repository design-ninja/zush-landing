allowBuilds:
  '@parcel/watcher': true
  '@posthog/cli': true
  esbuild: true
  sharp: true
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # 11.0.14 moves the rolldown import out of the function runtime; 11.0.13
  # crashes every server route on Vercel. Drop once 11.0.14 is 3 days old.
  - '@astrojs/vercel@11.0.14'

onlyBuiltDependencies:
  - esbuild
  - sharp
  - '@parcel/watcher'
  - '@posthog/cli'
